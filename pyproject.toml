[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-first-class"
version = "0.1.0"
description = "Make any GitHub repo first-class: canonical checkout, maximal polish, committed, pushed, remote SHA verified."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "toxicwind" }]
keywords = ["git", "github", "repo", "checkout", "polish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/toxicwind/repo-first-class"
Repository = "https://github.com/toxicwind/repo-first-class.git"
Issues = "https://github.com/toxicwind/repo-first-class/issues"

[project.scripts]
repo-first-class = "repo_first_class.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_first_class = ["data/ensure_checkout.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
